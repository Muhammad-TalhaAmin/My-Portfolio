name: Build and deploy Python app to Azure Web App - talhaamin-portfolio

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify application
        run: |
          python -c "import app; print('Application imported successfully:', app.app)"

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: talhaamin-portfolio
          slot-name: Production
          package: .
          startup-command: gunicorn --bind=0.0.0.0 --timeout 600 app:app --access-logfile - --error-logfile - --log-level info