<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login – My Portfolio</title>
    <script>
      (function () {
        const storedTheme = localStorage.getItem("theme");
        const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        const theme = storedTheme || (prefersDark ? "dark" : "light");
        const isLight = theme === "light";
        document.documentElement.classList.toggle("light", isLight);
        document.documentElement.setAttribute("data-theme", theme);
        document.documentElement.style.backgroundColor = isLight ? "#f8fafc" : "#050816";
        document.documentElement.style.color = isLight ? "#0f172a" : "#f9fafb";
      })();
    </script>
    <style>
      html {
        background-color: #050816;
        color: #f9fafb;
      }
      html.light {
        background-color: #f8fafc;
        color: #0f172a;
      }
      body {
        opacity: 0;
        transition: opacity 120ms ease;
      }
      html.ready body {
        opacity: 1;
      }
    </style>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}" />
  </head>
  <body>
    <div class="bg-gradient"></div>
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>

    <header class="header">
      <div class="logo">{ T<span>A }</span></div>
      <button id="theme-toggle" aria-label="Toggle dark mode">
        <span class="toggle-thumb"></span>
      </button>
    </header>

    <main>
      <section class="section">
        <div class="admin-layout">
          <div class="admin-card">
            <h1 class="section-title">Admin Login</h1>
            <p class="section-subtitle" style="margin-bottom: 20px;">Sign in to view contact messages.</p>

            {% if error %}
            <div class="admin-error">{{ error }}</div>
            {% endif %}

            <form method="POST">
              <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="admin@example.com" required autofocus />
              </div>
              <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter password" required />
              </div>
              <button type="submit" class="btn btn-primary" style="width: 100%;">Sign In</button>
            </form>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <p>© <span id="year"></span> Talha Amin. All rights reserved.</p>
    </footer>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
  </body>
</html>
