<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>500 – Internal Server Error | Talha Amin</title>
    <meta name="robots" content="noindex, nofollow" />
    <script>
      (function () {
        const storedTheme = localStorage.getItem("theme");
        const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        const theme = storedTheme || (prefersDark ? "dark" : "light");
        const isLight = theme === "light";
        document.documentElement.classList.toggle("light", isLight);
        document.documentElement.setAttribute("data-theme", theme);
        document.documentElement.style.backgroundColor = isLight ? "#f8fafc" : "#050816";
        document.documentElement.style.color = isLight ? "#0f172a" : "#f9fafb";
      })();
    </script>
    <style>
      html {
        background-color: #050816;
        color: #f9fafb;
      }
      html.light {
        background-color: #f8fafc;
        color: #0f172a;
      }
      body {
        opacity: 0;
        transition: opacity 120ms ease;
      }
      html.ready body {
        opacity: 1;
      }
    </style>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}" />
    <link rel="manifest" href="{{ url_for('manifest') }}" />
    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="34x34"
          href="{{ url_for('static', filename='assets/favicon.png') }}">

    <link rel="icon" type="image/png" sizes="18x18"
          href="{{ url_for('static', filename='assets/favicon.png') }}">

    <!-- Apple devices -->
    <link rel="apple-touch-icon"
          href="{{ url_for('static', filename='assets/favicon.png') }}">

    <!-- Browser theme color -->
  <meta name="theme-color" content="#0F172A">
  </head>
  <body class="inner-page">
    <div class="bg-gradient"></div>
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>

    <header class="header">

      <nav class="nav">

          <li><a href="{{ url_for('home') }}" class="nav-link">Home</a></li>

      <button id="theme-toggle" aria-label="Toggle dark mode">

      <button class="nav-toggle" aria-label="Toggle menu">
        <span></span><span></span>
      </button>
    </header>

    <main>
      <section class="section">
        <div class="error-layout">
          <h1 class="section-title">500</h1>
          <p class="section-subtitle">Something went wrong on our end. Please try again in a moment.</p>
          <a href="{{ url_for('home') }}" class="btn btn-primary">Back to Home</a>

    </main>

    <footer class="footer">

    </footer>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
  </body>
</html>
